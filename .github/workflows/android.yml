name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # استخراج فایل‌های تخت از files.zip و چیدن در ساختار پروژه
      - name: Unpack project files
        run: |
          unzip -o files.zip -d unpacked
          get() { find unpacked -type f -name "$1" -print -quit; }
          mv "$(get 'settings.gradle*')"  settings.gradle
          mv "$(get 'root-build.gradle*')" build.gradle
          mv "$(get 'gradle.properties*')" gradle.properties
          mv "$(get 'gradle-wrapper.properties*')" gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          mv "$(get 'app-build.gradle*')" app/build.gradle
          mv "$(get 'AndroidManifest.xml*')" app/src/main/AndroidManifest.xml
          mv "$(get 'MainActivity.kt*')" app/src/main/java/com/hoosha/pydroid/MainActivity.kt
          mv "$(get 'bootstrap.py*')" app/src/main/python/bootstrap.py
          mv "$(get 'editor.html*')" app/src/main/assets/editor/index.html
          mv "$(get 'values.xml*')" app/src/main/res/values/values.xml
          mv "$(get 'ic_launcher.xml*')" app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          mv "$(get 'bg_button_accent.xml*')" app/src/main/res/drawable/bg_button_accent.xml
          mv "$(get 'bg_button_ghost.xml*')" app/src/main/res/drawable/bg_button_ghost.xml
          mv "$(get 'bg_input.xml*')" app/src/main/res/drawable/bg_input.xml
          mv "$(get 'bg_placeholder.xml*')" app/src/main/res/drawable/bg_placeholder.xml
          mv "$(get 'bg_tab_active.xml*')" app/src/main/res/drawable/bg_tab_active.xml
          rm -rf unpacked

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle -p . assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMobStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # انتشار خودکار APK در تب Releases
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: PyMob Studio v1.1.${{ github.run_number }}
          body: |
            🚀 بیلد خودکار پروژهٔ PyMob Studio
            - نسخهٔ 1.1.0 (UI جدید)
            - فایل APK را از پایین همین صفحه دانلود و نصب کنید
          files: app/build/outputs/apk/debug/app-debug.apk
